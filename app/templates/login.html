{% extends "base.html" %}
{% block title %}Login - TG Bot Deployer{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-gray-800 rounded-lg p-8 border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-center">Admin Login</h1>
        {% if error %}
        <div class="bg-red-900/50 border border-red-700 text-red-300 px-4 py-2 rounded mb-4">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium transition">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
