{% if bot.status == 'deploying' %}
<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-blue-900/50 text-blue-400 border border-blue-800">
    <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
    Deploying
</span>
{% elif bot.status == 'running' %}
<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-green-900/50 text-green-400 border border-green-800">
    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
    Running
</span>
{% elif bot.status == 'stopped' %}
<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-yellow-900/50 text-yellow-400 border border-yellow-800">
    <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
    Stopped
</span>
{% elif bot.status == 'error' %}
<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-red-900/50 text-red-400 border border-red-800">
    <span class="w-2 h-2 rounded-full bg-red-400"></span>
    Error
</span>
{% else %}
<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-gray-700 text-gray-400 border border-gray-600">
    <span class="w-2 h-2 rounded-full bg-gray-400"></span>
    Created
</span>
{% endif %}
