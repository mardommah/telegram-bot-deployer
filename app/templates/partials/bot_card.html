<div class="bg-gray-800 rounded-lg p-5 border border-gray-700 hover:border-gray-600 transition">
    <div class="flex items-center justify-between mb-3">
        <a href="/bots/{{ bot.id }}" class="text-lg font-semibold text-blue-400 hover:text-blue-300">
            {{ bot.name }}
        </a>
        <div hx-get="/bots/{{ bot.id }}/status" hx-trigger="every 5s" hx-swap="innerHTML">
            {% include "partials/bot_status.html" %}
        </div>
    </div>
    <div class="text-sm text-gray-400">
        <p>File: {{ bot.filename }}</p>
        <p>Created: {{ bot.created_at.strftime('%Y-%m-%d %H:%M') }}</p>
    </div>
    <div class="mt-3">
        <a href="/bots/{{ bot.id }}" class="text-sm text-gray-400 hover:text-white transition">
            View Details &rarr;
        </a>
    </div>
</div>
